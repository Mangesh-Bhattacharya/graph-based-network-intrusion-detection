<svg viewBox="0 0 1040 500" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowDash" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="500" fill="#ffffff"/>

  <!-- ===== Laptops (original geometric icon: screen + hinge + base) ===== -->
  <g id="laptop1" transform="translate(120,40)">
    <rect x="0" y="0" width="64" height="42" rx="3" fill="#ffffff" stroke="#4b5563" stroke-width="2.5"/>
    <rect x="6" y="6" width="52" height="30" fill="#e5e7eb"/>
    <path d="M-8,42 L72,42 L64,52 L0,52 Z" fill="#9ca3af" stroke="#4b5563" stroke-width="1.5"/>
  </g>
  <g id="laptop2" transform="translate(300,10)">
    <rect x="0" y="0" width="64" height="42" rx="3" fill="#ffffff" stroke="#4b5563" stroke-width="2.5"/>
    <rect x="6" y="6" width="52" height="30" fill="#e5e7eb"/>
    <path d="M-8,42 L72,42 L64,52 L0,52 Z" fill="#9ca3af" stroke="#4b5563" stroke-width="1.5"/>
  </g>
  <g id="laptop3" transform="translate(90,120)">
    <rect x="0" y="0" width="64" height="42" rx="3" fill="#ffffff" stroke="#4b5563" stroke-width="2.5"/>
    <rect x="6" y="6" width="52" height="30" fill="#e5e7eb"/>
    <path d="M-8,42 L72,42 L64,52 L0,52 Z" fill="#9ca3af" stroke="#4b5563" stroke-width="1.5"/>
  </g>

  <!-- ===== Router / NIDS (original icon: rounded box + signal arrows) ===== -->
  <g id="router" transform="translate(455,110)">
    <ellipse cx="30" cy="34" rx="34" ry="16" fill="#4b5563"/>
    <rect x="-4" y="18" width="68" height="24" rx="8" fill="#6b7280"/>
    <path d="M14,24 L24,32 L14,40" stroke="#e5e7eb" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M46,24 L36,32 L46,40" stroke="#e5e7eb" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="30" y="-10" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">NIDS</text>
  </g>

  <!-- laptop -> router links -->
  <line x1="184" y1="72" x2="470" y2="140" stroke="#9ca3af" stroke-width="2"/>
  <line x1="364" y1="62" x2="470" y2="132" stroke="#9ca3af" stroke-width="2"/>
  <line x1="154" y1="152" x2="470" y2="145" stroke="#9ca3af" stroke-width="2"/>

  <!-- ===== Cloud / Internet (original icon: overlapping circles) ===== -->
  <g id="cloud" transform="translate(760,90)">
    <ellipse cx="60" cy="70" rx="95" ry="52" fill="#dbeafe"/>
    <circle cx="20" cy="55" r="34" fill="#dbeafe"/>
    <circle cx="70" cy="35" r="42" fill="#dbeafe"/>
    <circle cx="115" cy="55" r="32" fill="#dbeafe"/>
    <text x="60" y="78" text-anchor="middle" font-size="20" font-weight="700" fill="#1d4ed8">INTERNET</text>
  </g>
  <line x1="577" y1="132" x2="740" y2="132" stroke="#9ca3af" stroke-width="2"/>

  <!-- ===== Dashed flow: router -> captured traffic ===== -->
  <path d="M480,168 L200,255" stroke="#9ca3af" stroke-width="1.8" stroke-dasharray="6,5" fill="none" marker-end="url(#arrowDash)"/>

  <!-- ===== Captured traffic box ===== -->
  <text x="60" y="290" font-size="15" fill="#111827">CAPTURED TRAFFIC</text>
  <rect x="42" y="300" width="200" height="115" fill="none" stroke="#4b5563" stroke-width="2"/>
  <line x1="60" y1="325" x2="222" y2="325" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="60" y1="347" x2="222" y2="347" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="60" y1="369" x2="222" y2="369" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="60" y1="391" x2="222" y2="391" stroke="#9ca3af" stroke-width="1.5"/>

  <line x1="242" y1="357" x2="288" y2="357" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Graph representation (dashed rounded container) ===== -->
  <text x="360" y="290" font-size="15" fill="#111827">Graph representation</text>
  <rect x="300" y="300" width="220" height="115" rx="16" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="7,5"/>
  <line x1="360" y1="330" x2="410" y2="365" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="360" y1="330" x2="470" y2="345" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="410" y1="365" x2="470" y2="345" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="410" y1="365" x2="400" y2="400" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="470" y1="345" x2="400" y2="400" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="360" cy="330" r="9" fill="#2563eb"/>
  <circle cx="410" cy="365" r="9" fill="#2563eb"/>
  <circle cx="470" cy="345" r="9" fill="#2563eb"/>
  <circle cx="400" cy="400" r="9" fill="#2563eb"/>

  <text x="545" y="352" font-size="17" font-weight="700" fill="#111827">GNN</text>
  <line x1="522" y1="357" x2="600" y2="357" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Filtered traffic box ===== -->
  <text x="660" y="290" font-size="15" fill="#111827">FILTERED TRAFFIC</text>
  <rect x="642" y="300" width="200" height="115" fill="none" stroke="#4b5563" stroke-width="2"/>
  <line x1="678" y1="325" x2="822" y2="325" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="678" y1="347" x2="822" y2="347" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="678" y1="369" x2="822" y2="369" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="678" y1="391" x2="822" y2="391" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- checks / crosses -->
  <g stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M648,325 L654,331 L664,317" stroke="#16a34a"/>
    <path d="M648,347 L654,353 L664,339" stroke="#16a34a"/>
    <path d="M649,362 L661,376 M661,362 L649,376" stroke="#dc2626"/>
    <path d="M649,384 L661,398 M661,384 L649,398" stroke="#dc2626"/>
  </g>

  <!-- ===== Return loop: filtered traffic -> router ===== -->
  <path d="M846,357 C 920,357 920,180 480,155" stroke="#9ca3af" stroke-width="1.8" stroke-dasharray="6,5" fill="none" marker-end="url(#arrowDash)"/>
</svg>
