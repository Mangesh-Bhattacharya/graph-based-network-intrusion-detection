<svg width="1200" height="660" viewBox="0 0 1200 660" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrowBack" markerWidth="9" markerHeight="9" refX="2" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M7,0 L7,6 L0,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrowDash" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#94a3b8"/>
    </marker>
    <linearGradient id="routerFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="nodeBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="nodeAlert" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="screenFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2f7"/>
      <stop offset="1" stop-color="#dbe2ea"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="660" fill="#ffffff"/>

  <!-- ============ Title block ============ -->
  <text x="600" y="40" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a" letter-spacing="0.2">Graph-Based Network Intrusion Detection — Conceptual Pipeline</text>
  <text x="600" y="62" text-anchor="middle" font-size="13" font-style="italic" fill="#64748b">Captured traffic is represented as a graph and classified to separate benign from malicious flows</text>

  <!-- ============ Network topology (top) ============ -->
  <g id="laptop1" transform="translate(96,92)">
    <ellipse cx="35" cy="57" rx="34" ry="5" fill="#0f172a" opacity="0.08"/>
    <rect x="0" y="0" width="70" height="45" rx="4" fill="#ffffff" stroke="#334155" stroke-width="2.2"/>
    <rect x="6" y="6" width="58" height="32" fill="url(#screenFill)"/>
    <line x1="12" y1="15" x2="46" y2="15" stroke="#94a3b8" stroke-width="1.4"/>
    <line x1="12" y1="22" x2="54" y2="22" stroke="#94a3b8" stroke-width="1.4"/>
    <line x1="12" y1="29" x2="38" y2="29" stroke="#94a3b8" stroke-width="1.4"/>
    <path d="M-9,45 L79,45 L69,56 L1,56 Z" fill="#94a3b8" stroke="#334155" stroke-width="1.4"/>
  </g>
  <g id="laptop2" transform="translate(258,64)">
    <ellipse cx="35" cy="57" rx="34" ry="5" fill="#0f172a" opacity="0.08"/>
    <rect x="0" y="0" width="70" height="45" rx="4" fill="#ffffff" stroke="#334155" stroke-width="2.2"/>
    <rect x="6" y="6" width="58" height="32" fill="url(#screenFill)"/>
    <line x1="12" y1="15" x2="50" y2="15" stroke="#94a3b8" stroke-width="1.4"/>
    <line x1="12" y1="22" x2="42" y2="22" stroke="#94a3b8" stroke-width="1.4"/>
    <line x1="12" y1="29" x2="54" y2="29" stroke="#94a3b8" stroke-width="1.4"/>
    <path d="M-9,45 L79,45 L69,56 L1,56 Z" fill="#94a3b8" stroke="#334155" stroke-width="1.4"/>
  </g>
  <g id="laptop3" transform="translate(78,174)">
    <ellipse cx="35" cy="57" rx="34" ry="5" fill="#0f172a" opacity="0.08"/>
    <rect x="0" y="0" width="70" height="45" rx="4" fill="#ffffff" stroke="#334155" stroke-width="2.2"/>
    <rect x="6" y="6" width="58" height="32" fill="url(#screenFill)"/>
    <line x1="12" y1="15" x2="44" y2="15" stroke="#94a3b8" stroke-width="1.4"/>
    <line x1="12" y1="22" x2="52" y2="22" stroke="#94a3b8" stroke-width="1.4"/>
    <line x1="12" y1="29" x2="34" y2="29" stroke="#94a3b8" stroke-width="1.4"/>
    <path d="M-9,45 L79,45 L69,56 L1,56 Z" fill="#94a3b8" stroke="#334155" stroke-width="1.4"/>
  </g>
  <text x="140" y="248" text-anchor="middle" font-size="12.5" fill="#64748b" letter-spacing="0.5">INTERNAL HOSTS</text>

  <!-- Links: laptops -> router -->
  <line x1="166" y1="136" x2="538" y2="193" stroke="#94a3b8" stroke-width="1.8"/>
  <line x1="328" y1="118" x2="538" y2="186" stroke="#94a3b8" stroke-width="1.8"/>
  <line x1="148" y1="208" x2="538" y2="200" stroke="#94a3b8" stroke-width="1.8"/>

  <!-- Router / NIDS -->
  <g id="router" transform="translate(540,170)">
    <ellipse cx="45" cy="49" rx="46" ry="6" fill="#0f172a" opacity="0.10"/>
    <rect x="0" y="12" width="90" height="34" rx="9" fill="url(#routerFill)"/>
    <circle cx="14" cy="29" r="2.6" fill="#4ade80"/>
    <circle cx="23" cy="29" r="2.6" fill="#4ade80"/>
    <circle cx="32" cy="29" r="2.6" fill="#facc15"/>
    <path d="M50,20 L61,29 L50,38" stroke="#e2e8f0" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M80,20 L69,29 L80,38" stroke="#e2e8f0" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="45" y="-8" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">NIDS</text>
  </g>

  <!-- Router <-> Internet (single bidirectional line) -->
  <line x1="656" y1="190" x2="806" y2="180" stroke="#64748b" stroke-width="1.8" marker-start="url(#arrowBack)" marker-end="url(#arrow)"/>

  <!-- Cloud / Internet -->
  <g id="cloud" transform="translate(810,105)">
    <ellipse cx="130" cy="102" rx="150" ry="60" fill="#0f172a" opacity="0.05"/>
    <circle cx="38" cy="70" r="40" fill="#dbeafe"/>
    <circle cx="95" cy="42" r="52" fill="#dbeafe"/>
    <circle cx="165" cy="50" r="46" fill="#dbeafe"/>
    <circle cx="215" cy="75" r="36" fill="#dbeafe"/>
    <rect x="38" y="65" width="177" height="45" fill="#dbeafe"/>
    <ellipse cx="127" cy="108" rx="145" ry="30" fill="#dbeafe"/>
    <circle cx="127" cy="80" r="15" fill="none" stroke="#3b82f6" stroke-width="1.6" opacity="0.55"/>
    <ellipse cx="127" cy="80" rx="15" ry="6" fill="none" stroke="#3b82f6" stroke-width="1.2" opacity="0.55"/>
    <line x1="112" y1="80" x2="142" y2="80" stroke="#3b82f6" stroke-width="1.2" opacity="0.55"/>
    <text x="127" y="95" text-anchor="middle" font-size="19" font-weight="700" fill="#1d4ed8" letter-spacing="0.5">INTERNET</text>
  </g>

  <!-- Dashed flow: router -> captured traffic -->
  <path d="M552,217 C 470,275 330,315 240,353" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5,5" fill="none" marker-end="url(#arrowDash)"/>

  <!-- ============ Pipeline (bottom) ============ -->
  <!-- Step 1 -->
  <circle cx="215" cy="326" r="15" fill="#1d4ed8"/>
  <text x="215" y="331" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
  <text x="90" y="374" font-size="14.5" font-weight="700" fill="#0f172a" letter-spacing="0.4">CAPTURED TRAFFIC</text>
  <g>
    <rect x="93" y="387" width="245" height="128" rx="6" fill="#0f172a" opacity="0.04"/>
    <rect x="90" y="384" width="245" height="128" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
    <line x1="110" y1="410" x2="315" y2="410" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round"/>
    <line x1="110" y1="434" x2="290" y2="434" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round"/>
    <line x1="110" y1="458" x2="305" y2="458" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round"/>
    <line x1="110" y1="482" x2="270" y2="482" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round"/>
  </g>

  <line x1="337" y1="448" x2="384" y2="448" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <circle cx="565" cy="326" r="15" fill="#1d4ed8"/>
  <text x="565" y="331" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2</text>
  <text x="440" y="374" font-size="14.5" font-weight="700" fill="#0f172a" letter-spacing="0.4">GRAPH REPRESENTATION</text>
  <g>
    <rect x="393" y="387" width="345" height="128" rx="18" fill="#0f172a" opacity="0.04"/>
    <rect x="390" y="384" width="345" height="128" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6,5"/>
    <line x1="500" y1="420" x2="465" y2="459" stroke="#3b82f6" stroke-width="2"/>
    <line x1="500" y1="420" x2="565" y2="445" stroke="#3b82f6" stroke-width="2"/>
    <line x1="500" y1="420" x2="620" y2="410" stroke="#3b82f6" stroke-width="2"/>
    <line x1="565" y1="445" x2="600" y2="483" stroke="#3b82f6" stroke-width="2"/>
    <line x1="465" y1="459" x2="600" y2="483" stroke="#3b82f6" stroke-width="1.6" opacity="0.6"/>
    <line x1="565" y1="445" x2="620" y2="410" stroke="#3b82f6" stroke-width="1.6" opacity="0.6"/>
    <circle cx="500" cy="420" r="9" fill="url(#nodeBlue)"/>
    <circle cx="465" cy="459" r="7" fill="url(#nodeBlue)"/>
    <circle cx="620" cy="410" r="7" fill="url(#nodeBlue)"/>
    <circle cx="565" cy="445" r="7" fill="url(#nodeBlue)"/>
    <circle cx="600" cy="483" r="11" fill="none" stroke="#f87171" stroke-width="1.6" opacity="0.55"/>
    <circle cx="600" cy="483" r="8" fill="url(#nodeAlert)"/>
  </g>

  <g transform="translate(745,378)">
    <circle cx="8" cy="8" r="4.2" fill="none" stroke="#1d4ed8" stroke-width="1.4"/>
    <circle cx="20" cy="2" r="4.2" fill="none" stroke="#1d4ed8" stroke-width="1.4"/>
    <circle cx="20" cy="16" r="4.2" fill="none" stroke="#1d4ed8" stroke-width="1.4"/>
    <line x1="11.5" y1="7" x2="16.5" y2="4" stroke="#1d4ed8" stroke-width="1.1"/>
    <line x1="11.5" y1="9" x2="16.5" y2="13" stroke="#1d4ed8" stroke-width="1.1"/>
  </g>
  <text x="762" y="425" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">GNN</text>
  <line x1="736" y1="448" x2="786" y2="448" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <circle cx="915" cy="326" r="15" fill="#1d4ed8"/>
  <text x="915" y="331" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3</text>
  <text x="795" y="374" font-size="14.5" font-weight="700" fill="#0f172a" letter-spacing="0.4">FILTERED TRAFFIC</text>
  <g>
    <rect x="793" y="387" width="255" height="128" rx="6" fill="#0f172a" opacity="0.04"/>
    <rect x="790" y="384" width="255" height="128" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>

    <rect x="800" y="394" width="235" height="27" rx="4" fill="#dcfce7"/>
    <path d="M812,407 L818,413 L830,399" stroke="#16a34a" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="840" y1="407" x2="1020" y2="407" stroke="#86efac" stroke-width="4" stroke-linecap="round"/>

    <rect x="800" y="425" width="235" height="27" rx="4" fill="#dcfce7"/>
    <path d="M812,438 L818,444 L830,430" stroke="#16a34a" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="840" y1="438" x2="1000" y2="438" stroke="#86efac" stroke-width="4" stroke-linecap="round"/>

    <rect x="800" y="456" width="235" height="27" rx="4" fill="#fee2e2"/>
    <path d="M813,463 L825,475 M825,463 L813,475" stroke="#dc2626" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="840" y1="469" x2="1010" y2="469" stroke="#fca5a5" stroke-width="4" stroke-linecap="round"/>

    <rect x="800" y="487" width="235" height="20" rx="4" fill="#fee2e2"/>
    <path d="M813,491 L822,500 M822,491 L813,500" stroke="#dc2626" stroke-width="2.3" stroke-linecap="round"/>
    <line x1="834" y1="496" x2="980" y2="496" stroke="#fca5a5" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Dashed flow: filtered traffic -> router -->
  <path d="M1005,386 C 1085,320 940,265 613,217" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5,5" fill="none" marker-end="url(#arrowDash)"/>

  <!-- ============ Legend ============ -->
  <g transform="translate(150,545)">
    <rect x="0" y="2" width="16" height="16" rx="3" fill="#dcfce7"/>
    <path d="M3,10 L7,14 L13,5" stroke="#16a34a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="24" y="15" font-size="12.5" fill="#334155">Classified benign</text>
  </g>
  <g transform="translate(330,545)">
    <rect x="0" y="2" width="16" height="16" rx="3" fill="#fee2e2"/>
    <path d="M4,6 L12,14 M12,6 L4,14" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
    <text x="24" y="15" font-size="12.5" fill="#334155">Classified malicious</text>
  </g>
  <g transform="translate(520,545)">
    <circle cx="9" cy="10" r="9" fill="none" stroke="#f87171" stroke-width="1.4" opacity="0.6"/>
    <circle cx="9" cy="10" r="6" fill="url(#nodeAlert)"/>
    <text x="26" y="15" font-size="12.5" fill="#334155">High-centrality / anomalous node</text>
  </g>
  <g transform="translate(780,545)">
    <circle cx="9" cy="10" r="6" fill="url(#nodeBlue)"/>
    <text x="26" y="15" font-size="12.5" fill="#334155">Regular host node</text>
  </g>

  <!-- Caption -->
  <text x="600" y="605" text-anchor="middle" font-size="12" font-style="italic" fill="#94a3b8">Figure: motivating architecture for graph-based intrusion detection (NIDS = Network Intrusion Detection System).</text>
  <text x="600" y="624" text-anchor="middle" font-size="12" font-style="italic" fill="#94a3b8">Conceptual diagram — see project README for the implemented pipeline.</text>
</svg>
